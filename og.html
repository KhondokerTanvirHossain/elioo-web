<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: linear-gradient(180deg, var(--bg), var(--bg2) 60%, var(--bg3)); display: grid; place-items: center; position: relative; }
    .og { display: grid; gap: 22px; text-align: center; position: relative; }
    .mark { font-size: 140px; justify-self: center; }
    .tag { font: 700 30px/1.3 var(--body); color: var(--mute); }
  </style>
</head>
<body>
  <div class="beam" aria-hidden="true"></div>
  <div class="og">
    <span class="mark" aria-hidden="true"><span class="m-el">el</span><span class="m-i">i<b class="m-planet"><u></u></b></span><span class="m-oo"><i></i><i></i></span></span>
    <div class="tag">Little bots for the big stuff in life.</div>
  </div>
</body>
</html>
