name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/khondokertanvirhossain/elioo-web

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check, unit tests, builds, dist checks, video budget
        run: npm run check
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Container image
        run: bash tests/deploy/image.test.sh
      - name: Deploy script
        run: bash tests/deploy/deploy.test.sh

  deploy:
    name: Build image and deploy to EC2
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One deploy at a time; never cancel one halfway.
    concurrency:
      group: deploy-elioo-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "${{ github.sha }}" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; echo "Skipping: ${{ github.sha }} is not the tip of main ($tip)"; fi
      - uses: docker/login-action@v3
        if: steps.tip.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.tip.outputs.current == 'true'
      - name: Build and push image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Copy deploy.sh to server
        if: steps.tip.outputs.current == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/deploy.sh
          target: /home/ec2-user/elioo-web
          strip_components: 1
      - name: Deploy on server
        if: steps.tip.outputs.current == 'true'
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: IMAGE_TAG="$IMAGE_TAG" bash /home/ec2-user/elioo-web/deploy.sh
      - name: Smoke test
        if: steps.tip.outputs.current == 'true'
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: bash scripts/smoke.sh
